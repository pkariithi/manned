name: Build .deb Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-deb:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.5'
        channel: 'stable'
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev debhelper
        
    - name: Build Flutter release
      run: flutter build linux --release
      
    - name: Build .deb package
      run: ./packaging/build_deb.sh
      
    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        
    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: manned-pages-deb
        path: manned-pages_*.deb
        retention-days: 30
        if-no-files-found: error
      
    - name: Summary
      run: |
        echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ .deb package built successfully" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the artifact from this workflow run" >> $GITHUB_STEP_SUMMARY
        echo "2. Create a manual release on GitHub: https://github.com/pkariithi/manned/releases/new" >> $GITHUB_STEP_SUMMARY
        echo "3. Upload the .deb file to the release" >> $GITHUB_STEP_SUMMARY

